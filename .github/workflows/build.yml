name: Build
on:
  push:
  workflow_dispatch:

# One run per branch: on basic a newer push waits for the running one (only the newest
# waits), so a publish is never cut off and "latest" ends with the newest build; on other
# branches a newer push cancels the older run. A manual run shares the branch's group.
concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/basic' }}

# Read-only by default; only the publish job writes the release
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set artifact name
        id: vars
        run: |
          case "${{ github.ref_name }}" in
            basic) echo "name=decoder" ;;
            v2)     echo "name=decoder-v2" ;;
            v3)     echo "name=decoder-v3" ;;
            *)      echo "name=decoder-$(echo '${{ github.ref_name }}' | tr '/' '-')" ;;
          esac >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS:     ${{ secrets.KEY_ALIAS }}
          KEY_PASS:      ${{ secrets.KEY_PASS }}
        run: |
          echo "${{ secrets.KEY }}" | base64 -d > key.jks
          # APK only while in development; the .aab (bundleRelease) is for store uploads
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release.apk ${{ steps.vars.outputs.name }}.apk

      # Every build is a workflow artifact; on basic the publish job takes it from here
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.name }}
          path: ${{ steps.vars.outputs.name }}.apk

  # The one release, "latest" (#194, #229), shared with v2: basic replaces only decoder.apk
  # and its line in the notes, keeps the tag and the title. Nothing goes to Telegram from
  # basic: the channel gets the v2 APK only (#240). The concurrency group is shared with v2's
  # workflow: one publish at a time. The script is the same as on v2.
  publish:
    needs: build
    if: github.ref_name == 'basic'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # update the release
    concurrency:
      group: release-latest
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: decoder
          path: dist

      - name: Publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)"[[:space:]]*$/\1/p' app/build.gradle)
          [ -n "$VER" ] || { echo "::error::no versionName in app/build.gradle"; exit 1; }
          .github/publish-latest.sh basic "$VER" dist/decoder.apk
