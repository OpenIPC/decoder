name: "Device report / 设备报告 / Отчёт об устройстве"
description: Report how OpenIPC Decoder works on your phone, tablet, TV, set-top box or car device
title: "User test report / 用户测试报告 / Отчёт о тестировании от пользователя"
labels: ["device-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! Reports are collected into the **Verified devices** table in [docs/devices.md](https://github.com/OpenIPC/decoder/blob/v2/docs/devices.md#verified-devices).
        The app version is shown in the menu next to **Exit**, for example `v2.02`.

        感谢测试！可以用中文填写。应用版本显示在菜单中 **Exit** 旁边。

        Спасибо за тестирование! Можно писать по-русски. Версия приложения — в меню рядом с **Exit**.

  - type: dropdown
    id: device_type
    attributes:
      label: "Device type / 设备类型 / Тип устройства"
      options:
        - "Phone / 手机 / Телефон"
        - "Tablet / 平板 / Планшет"
        - "TV / 电视 / Телевизор"
        - "Set-top box / 机顶盒 / ТВ-приставка"
        - "Car device, mirror / 车载设备、后视镜 / Автомобильное устройство, зеркало"
        - "Other / 其他 / Другое"
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: "Manufacturer and model / 厂商和型号 / Производитель и модель"
      placeholder: "Samsung Galaxy A51 (SM-A515F)"
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: "Android version, firmware / Android 版本、固件 / Версия Android, прошивка"
      description: Android version, plus the vendor firmware if it is not stock (ColorOS, SlimBOXtv, ...)
      placeholder: "Android 13 / One UI 5.1"
    validations:
      required: true

  - type: input
    id: soc
    attributes:
      label: "SoC and kernel version / 芯片和内核版本 / SoC и версия ядра"
      description: Settings → About → Kernel version. SoC if known (Amlogic S905X3, Allwinner H313, ...)
      placeholder: "Exynos 9611, kernel 4.14.113"

  - type: input
    id: app_version
    attributes:
      label: "App version / 应用版本 / Версия приложения"
      description: Shown in the menu next to Exit
      placeholder: "v2.02"
    validations:
      required: true

  - type: dropdown
    id: result
    attributes:
      label: "Overall result / 总体结果 / Общий результат"
      options:
        - "Works / 正常 / Работает"
        - "Works with issues / 可用但有问题 / Работает с проблемами"
        - "Does not work / 不能用 / Не работает"
    validations:
      required: true

  - type: checkboxes
    id: works
    attributes:
      label: "What works / 哪些功能正常 / Что работает"
      options:
        - label: "H.264 video / H.264 视频 / Видео H.264"
        - label: "H.265 video / H.265 视频 / Видео H.265"
        - label: "Audio / 音频 / Звук"
        - label: "Multi-view / 多画面 / Мультивью"
        - label: "Remote control, D-pad / 遥控器、方向键 / Пульт, D-pad"
        - label: "WebUI"
        - label: "Screenshot (long press) / 截图（长按） / Скриншот (долгое нажатие)"

  - type: textarea
    id: stream
    attributes:
      label: "Camera and stream / 摄像机和码流 / Камера и поток"
      description: Camera firmware (OpenIPC or other), resolution, FPS, bitrate, audio codec
      placeholder: "OpenIPC on gk7205v300, H.265 1920x1080@25, 2 Mbps, AAC 16 kHz"

  - type: textarea
    id: notes
    attributes:
      label: "Problems and notes / 问题和备注 / Проблемы и заметки"
      description: What did not work or looked wrong (cropped picture, no sound, delay, crash, ...)

  - type: textarea
    id: logs
    attributes:
      label: "Log (optional) / 日志（可选） / Лог (необязательно)"
      description: "With USB/network debugging enabled: `adb logcat -d -s OpenIPCDecoder`"
      render: text
