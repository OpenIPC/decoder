plugins {
    alias(libs.plugins.android.application)
}

static def getGitHash() {
    def process = "git rev-parse --short HEAD".execute()
    return process.text.trim()
}

android {
    namespace = 'com.openipc.decoder'
    compileSdk = 36

    defaultConfig {
        applicationId "com.openipc.decoder"
        minSdk 21
        targetSdk 36
        versionCode 32
        versionName "2.07"

        buildConfigField "String", "GIT_HASH", "\"${getGitHash()}\""
    }

    buildFeatures {
        buildConfig = true
    }

    // Signing credentials from environment variables; null when absent.
    // Debug builds ignore this config; release builds fail at signing time.
    signingConfigs {
        create("release") {
            storeFile file("../key.jks")
            storePassword System.getenv("KEYSTORE_PASS")
            keyAlias      System.getenv("KEY_ALIAS")
            keyPassword   System.getenv("KEY_PASS")
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
            // No META-INF/version-control-info.textproto (#181): BuildConfig.GIT_HASH has the commit
            vcsInfo.include = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions {
        // android.jar stubs (Log, ...) return defaults instead of throwing in JVM unit tests
        unitTests.returnDefaultValues = true
    }

    // No dependency metadata in the APK and bundle (#181): there are no runtime dependencies
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    lint {
        // Known issues are recorded in the baseline; only new ones fail the build
        baseline = file("lint-baseline.xml")
    }
}

dependencies {
    testImplementation libs.junit
}
