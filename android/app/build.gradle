plugins {
    alias(libs.plugins.android.application)
}

static def getGitHash() {
    def process = "git rev-parse --short HEAD".execute()
    return process.text.trim()
}

android {
    namespace = 'com.openipc.decoder'
    compileSdk = 36
    // The NDK strips the camex tunnel's libcamex.so when the APK is packed: without it the
    // library keeps its debug sections (about 2.5 times the size)
    ndkVersion rootProject.ext.decoderNdk

    defaultConfig {
        applicationId "com.openipc.decoder"
        minSdk 21
        targetSdk 36
        versionCode 58
        versionName "2.24.1"
        // Keep only these locales of the libraries' resources, as in the other OpenIPC apps
        resourceConfigurations += ['en', 'ru', 'zh-rCN']

        // The ABIs of the tunnel's native code: android/build.gradle, -PdecoderAbis (#272)
        ndk {
            abiFilters(*rootProject.ext.decoderAbis)
        }

        buildConfigField "String", "GIT_HASH", "\"${getGitHash()}\""
    }

    buildFeatures {
        buildConfig = true
    }

    // Signing credentials from environment variables; null when absent.
    // Debug builds ignore this config; release builds fail at signing time.
    signingConfigs {
        create("release") {
            storeFile file("../key.jks")
            storePassword System.getenv("KEYSTORE_PASS")
            keyAlias      System.getenv("KEY_ALIAS")
            keyPassword   System.getenv("KEY_PASS")
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
            // No META-INF/version-control-info.textproto (#181): BuildConfig.GIT_HASH has the commit
            vcsInfo.include = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions {
        // android.jar stubs (Log, ...) return defaults instead of throwing in JVM unit tests
        unitTests.returnDefaultValues = true
    }

    // No dependency metadata in the APK and bundle (#181): there are no runtime dependencies
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    lint {
        // Known issues are recorded in the baseline; only new ones fail the build
        baseline = file("lint-baseline.xml")
        // arm64-v8a and armeabi-v7a by default, x86_64 only with -PdecoderAbis (the emulator);
        // ChromeOS is not a target
        disable 'ChromeOsAbiSupport'
    }
}

dependencies {
    // The camex tunnel (#272), android/settings.gradle
    implementation project(':camex-tunnel')
    testImplementation libs.junit
}
